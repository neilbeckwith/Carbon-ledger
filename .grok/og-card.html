<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "Instrument Sans";
    src: url("file:///workspace/.grok/fonts/InstrumentSans-Regular.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Instrument Serif";
    src: url("file:///workspace/.grok/fonts/InstrumentSerif-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("file:///workspace/.grok/fonts/IBMPlexMono-Light.ttf") format("truetype");
    font-weight: 300;
    font-style: normal;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("file:///workspace/.grok/fonts/IBMPlexMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #101411;
    color: #e7efe9;
  }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 78% 70% at 50% 44%, #1a2420 0%, #101411 68%);
    font-family: "Instrument Sans", "Liberation Sans", sans-serif;
  }

  .plate {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(121, 181, 166, 0.38);
  }
  .plate::before,
  .plate::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: #79b5a6;
    border-style: solid;
  }
  .plate::before {
    top: -1px;
    left: -1px;
    border-width: 1.5px 0 0 1.5px;
  }
  .plate::after {
    right: -1px;
    bottom: -1px;
    border-width: 0 1.5px 1.5px 0;
  }
  .corner-tr, .corner-bl {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: #79b5a6;
    border-style: solid;
  }
  .corner-tr { top: -1px; right: -1px; border-width: 1.5px 1.5px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 1.5px 1.5px; }

  .lockup {
    position: absolute;
    left: 0;
    right: 0;
    top: 78px;
    text-align: center;
  }
  .kicker {
    font-weight: 520;
    font-size: 13px;
    letter-spacing: 0.52em;
    color: #79b5a6;
    padding-left: 0.52em;
  }
  h1 {
    margin-top: 22px;
    font-family: "Instrument Serif", "Liberation Serif", serif;
    font-weight: 400;
    font-size: 86px;
    line-height: 0.86;
    letter-spacing: 0.01em;
    color: #e7efe9;
  }
  h1 span { display: block; }

  .readout {
    margin-top: 34px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 12px;
  }
  .num {
    font-family: "IBM Plex Mono", "Liberation Mono", monospace;
    font-weight: 300;
    font-size: 118px;
    line-height: 0.85;
    letter-spacing: -0.035em;
    color: #e7efe9;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    margin-top: 14px;
    font-family: "IBM Plex Mono", "Liberation Mono", monospace;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: #79b5a6;
  }
  .rule {
    width: 156px;
    height: 2px;
    margin: 26px auto 0;
    background: #e08a45;
  }
  .sub {
    margin-top: 16px;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.42em;
    color: rgba(231, 239, 233, 0.72);
    padding-left: 0.42em;
  }

  .scale {
    position: absolute;
    left: 48px;
    right: 48px;
    bottom: 22px;
    height: 22px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .scale i {
    display: block;
    width: 1px;
    height: 7px;
    background: #79b5a6;
    opacity: 0.45;
  }
  .scale i.mid { height: 12px; opacity: 0.75; }
  .scale i.major { height: 18px; opacity: 0.95; background: #e7efe9; }
  .scale i.mark { height: 22px; width: 2px; opacity: 1; background: #e08a45; }
</style>
</head>
<body>
  <div class="plate">
    <span class="corner-tr"></span>
    <span class="corner-bl"></span>
    <div class="lockup">
      <p class="kicker">MAUNA LOA</p>
      <h1><span>Carbon</span><span>Ledger</span></h1>
      <div class="readout">
        <span class="num">428.21</span>
        <span class="unit">ppm</span>
      </div>
      <div class="rule"></div>
      <p class="sub">PARTS PER MILLION</p>
    </div>
    <div class="scale" id="scale"></div>
  </div>
  <script>
    const scale = document.getElementById("scale");
    const n = 61;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("i");
      if (i === Math.floor(n / 2)) el.className = "mark";
      else if (i % 10 === 0) el.className = "major";
      else if (i % 5 === 0) el.className = "mid";
      scale.appendChild(el);
    }
  </script>
</body>
</html>
